- id: structkit-validate
  name: StructKit Validate
  description: Validate StructKit YAML structure files for syntax and schema compliance
  entry: structkit-validate-hook
  language: python
  files: \.struct\.yaml$|structures/.*\.ya?ml$
  additional_dependencies: ['structkit']

- id: structkit-lint
  name: StructKit Lint
  description: Lint StructKit YAML structure files for quality and safety issues
  entry: structkit-lint-hook
  language: python
  files: \.struct\.yaml$|structures/.*\.ya?ml$
  additional_dependencies: ['structkit']
