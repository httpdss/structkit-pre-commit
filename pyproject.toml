[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structkit-pre-commit"
version = "1.0.0"
description = "Pre-commit hooks for StructKit YAML structure validation"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Kenneth Belitzky"}]
requires-python = ">=3.8"
dependencies = ["structkit"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/httpdss/structkit-pre-commit"
Repository = "https://github.com/httpdss/structkit-pre-commit"
"Bug Tracker" = "https://github.com/httpdss/structkit-pre-commit/issues"

[project.scripts]
structkit-validate-hook = "structkit_validate_hook:main"
structkit-lint-hook = "structkit_lint_hook:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py38']
